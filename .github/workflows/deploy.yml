name: Deploy to GitHub Pages

# Builds the site and the data snapshots it reads (scripts/build_data.py).
# Yahoo Finance / SEC / House Clerk can't be called from the browser (no CORS),
# so this job fetches them server-side and publishes JSON under ./data/.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '*/15 13-21 * * 1-5'   # US market hours (UTC): refresh the Day Trader desk
    - cron: '20 1 * * *'           # daily: screener fundamentals (US + India) after both markets close

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install data job dependencies
        run: pip install -r scripts/requirements.txt
      - name: Test data job
        run: python -m unittest discover -s scripts
      # Fundamentals are rebuilt once a day; the previous run's data is reused in between
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .data-cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Build data snapshots
        continue-on-error: true      # a data-source outage must not block deploying the site
        env:
          SEC_USER_AGENT: FinEngine data job (github.com/${{ github.repository }}) ${{ github.repository_owner }}@users.noreply.github.com
        run: python scripts/build_data.py --out dist/data --cache .data-cache
      - name: Save data cache
        if: always() && hashFiles('.data-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .data-cache
          key: data-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
