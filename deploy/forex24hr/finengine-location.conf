# FinEngine live API (C:\FinEngine, port 8100), served at https://app.forex24hr.com/finengine/
# Included inside the app.forex24hr.com server blocks by install-finengine.ps1.
location /finengine/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;     # the first desk build fetches ~40 charts
    proxy_send_timeout 300s;
}
