<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinEngine</title>
  </head>
  <body>
    <script>
      // SPA fallback: redirect all routes to index.html (GitHub Pages SPA support)
      var l = window.location;
      l.replace(l.protocol + '//' + l.host + l.pathname.replace(/\/+$/, '') + '?__spa_redirect=' + encodeURIComponent(l.pathname + l.search + l.hash) + '#' + l.pathname + l.search + l.hash);
    </script>
  </body>
</html>
